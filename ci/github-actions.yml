# GitHub Actions workflow for nightsquad. To turn CI on, copy this file to
# .github/workflows/ci.yml. It is kept here because the coding session that wrote it
# was not allowed to push workflow files.

name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nightsquad
          POSTGRES_PASSWORD: nightsquad
          POSTGRES_DB: nightsquad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nightsquad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NIGHTSQUAD_TEST_POSTGRES_URL: postgresql://nightsquad:nightsquad@localhost:5432/nightsquad_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run python -m nightsquad.domain.memory.fetch_model
      # The container tests skip without this image (EXE-12, WRK-7).
      - run: docker build -f deploy/agent.Dockerfile -t nightsquad-agent .
      - run: uv run pytest --db=${{ matrix.db }}

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync --locked
        working-directory: .
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
