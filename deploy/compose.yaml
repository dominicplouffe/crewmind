# A full Nightsquad server (NFR-1, NFR-2): Postgres with pgvector, the server, and a TLS
# front. Agent runs and platform checks are sibling containers from the agent image
# (EXE-12, WRK-7).
#
#   deploy/deploy_single_server.sh --admin-email you@example.com
#
# is the supported way to start it: it writes deploy/.env, builds both images, starts
# everything and prints the first admin's setup link. deploy/update_single_server.sh
# updates it and deploy/kill_single_server.sh stops it.
#
# What is published (NFR-6):
#   - the TLS front, on NIGHTSQUAD_BIND (127.0.0.1 unless you choose another address);
#   - the server's plain port, on 127.0.0.1 only, for the `squad` command on this host.
# People sign in at NIGHTSQUAD_PUBLIC_URL and nowhere else.

name: nightsquad

services:
  database:
    # The same major version as the client tools in the server image (deploy/Dockerfile):
    # backup and restore use them.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: nightsquad
      POSTGRES_PASSWORD: ${NIGHTSQUAD_DB_PASSWORD:?run deploy/deploy_single_server.sh, or set NIGHTSQUAD_DB_PASSWORD in deploy/.env}
      POSTGRES_DB: nightsquad
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nightsquad"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: nightsquad-server
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      NIGHTSQUAD_DATABASE_URL: postgresql://nightsquad:${NIGHTSQUAD_DB_PASSWORD}@database:5432/nightsquad
      NIGHTSQUAD_DATA_DIR: ${NIGHTSQUAD_STATE_ROOT:-/var/lib/nightsquad}
      NIGHTSQUAD_HOST: 0.0.0.0
      NIGHTSQUAD_PUBLIC_URL: ${NIGHTSQUAD_PUBLIC_URL:-https://localhost}
      # Where sandboxes reach the server. The server joins each project's network under
      # this name (EXE-12).
      NIGHTSQUAD_AGENT_API_URL: http://server:8420
      # Limits of each agent's container. On a host with fewer CPUs than this, a
      # container is given all the host has.
      NIGHTSQUAD_SANDBOX_CPUS: ${NIGHTSQUAD_SANDBOX_CPUS:-2}
      NIGHTSQUAD_SANDBOX_MEMORY: ${NIGHTSQUAD_SANDBOX_MEMORY:-2147483648}
    volumes:
      # Sandboxes are started by the host's container runtime, so a workspace must have
      # the same path on the host and in the server.
      - ${NIGHTSQUAD_STATE_ROOT:-/var/lib/nightsquad}:${NIGHTSQUAD_STATE_ROOT:-/var/lib/nightsquad}
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:8420:8420"

  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - server
    environment:
      NIGHTSQUAD_PUBLIC_URL: ${NIGHTSQUAD_PUBLIC_URL:-https://localhost}
      NIGHTSQUAD_PUBLIC_HOST: ${NIGHTSQUAD_PUBLIC_HOST:-localhost}
      NIGHTSQUAD_TLS: ${NIGHTSQUAD_TLS:-internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - proxy:/data
    ports:
      - "${NIGHTSQUAD_BIND:-127.0.0.1}:${NIGHTSQUAD_TLS_PORT:-443}:${NIGHTSQUAD_TLS_PORT:-443}"

  # Not a running service: it exists so that one build makes the agent image too.
  agent:
    build:
      context: ..
      dockerfile: deploy/agent.Dockerfile
    image: nightsquad-agent
    restart: "no"
    network_mode: none
    command: ["true"]

volumes:
  database:
  proxy:
