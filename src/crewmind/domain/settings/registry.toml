[[constraints]]
id = "warn_before_wrapup"
settings = ["budget.warn_at", "budget.wrapup_at"]
spec = "`budget.warn_at` < `budget.wrapup_at`."

[[constraints]]
id = "independent_review_off_only_solo"
settings = ["review.independent"]
spec = "`review.independent` may be off only in a solo project (WRK-9)."

[[constraints]]
id = "verdict_never_ceo"
settings = ["authority.verdict"]
spec = "`authority.verdict` is never the CEO (P5)."

[[constraints]]
id = "cycle_settings_operate_only"
settings = ["cycle.period", "cycle.roll_day", "cycle.due_time"]
spec = "`cycle.*` settings exist only on Operate projects."

