# The settings registry, transcribed from docs/spec/appendix-a-settings.md.
# A test fails when this file and Appendix A differ. Change both in the same commit.
# Durations are in seconds, sizes in bytes, percentages in whole percent.

version = "2.4"

[settings."quality"]
type = "enum"
scope = "project"
default = "balanced"
choices = ["fast", "balanced", "best"]
used_by = ["LLM-3"]
spec_default = "balanced"
spec_range = "fast, balanced, best"

[settings."budget.tokens"]
type = "tokens"
scope = "project"
default_by = { setting = "project.type", values = { deliver = 20000000, explore = 10000000, operate = 40000000 } }
min = 1000000
used_by = ["GOV-2"]
spec_default = "Deliver 20M total; Explore 10M total; Operate 40M per month, all non-cached tokens (starting defaults; the Founder sizes each project)"
spec_range = "1M or more"

[settings."budget.ceo_reserve"]
type = "percent"
scope = "project"
default = 10
min = 0
max = 50
used_by = ["GOV-3", "GOV-10"]
spec_default = "10% of the budget"
spec_range = "0 (off)–50%"

[settings."budget.warn_at"]
